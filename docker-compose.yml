services:
  postgres:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_DB: sri_template_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:8.0
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  identity-service:
    build:
      context: .
      dockerfile: ./backend/IdentityService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sri_template_dev;Username=postgres;Password=postgres
      - Jwt__SecretKey=navarch-studio-local-development-secret-key-min-32-chars
      - Jwt__Issuer=navarch-studio-local
      - Jwt__Audience=navarch-studio-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  data-service:
    build:
      context: .
      dockerfile: ./backend/DataService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sri_template_dev;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Jwt__SecretKey=navarch-studio-local-development-secret-key-min-32-chars
      - Jwt__Issuer=navarch-studio-local
      - Jwt__Audience=navarch-studio-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hull-sizing-service:
    build:
      context: .
      dockerfile: ./backend/HullSizingService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sri_template_dev;Username=postgres;Password=postgres
      - Services__DataService=http://data-service:8080
      - Jwt__SecretKey=navarch-studio-local-development-secret-key-min-32-chars
      - Jwt__Issuer=navarch-studio-local
      - Jwt__Audience=navarch-studio-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-agent-service:
    build:
      context: .
      dockerfile: ./backend/AIAgentService/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sri_template_dev;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - Services__HullSizingService=http://hull-sizing-service:8080
      - Jwt__SecretKey=navarch-studio-local-development-secret-key-min-32-chars
      - Jwt__Issuer=navarch-studio-local
      - Jwt__Audience=navarch-studio-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: ./backend/ApiGateway/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__IdentityService=http://identity-service:8080
      - Services__DataService=http://data-service:8080
      - Services__HullSizingService=http://hull-sizing-service:8080
      - Services__AIAgentService=http://ai-agent-service:8080
      - Jwt__SecretKey=navarch-studio-local-development-secret-key-min-32-chars
      - Jwt__Issuer=navarch-studio-local
      - Jwt__Audience=navarch-studio-api
    depends_on:
      identity-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
      hull-sizing-service:
        condition: service_healthy
      # ai-agent-service:
      #   condition: service_healthy  # Temporarily disabled - not critical for testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5002
      - VITE_AUTH_MODE=local
    volumes:
      - ./frontend:/app
      - ./packages:/packages
      - /app/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
