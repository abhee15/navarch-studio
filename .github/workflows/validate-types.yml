name: Validate TypeScript Types

# ⚠️  CURRENTLY DISABLED - Waiting for initial setup
#
# This workflow validates that TypeScript types match backend DTOs.
# It's temporarily disabled until swagger.json files are generated.
#
# To activate:
#   1. Start backend services
#   2. Run: pwsh scripts/export-swagger.ps1
#   3. Run: pwsh scripts/generate-types.ps1 -Mode ci
#   4. Commit backend/*/swagger.json and frontend/src/api/generated/*.types.ts
#   5. Uncomment the automatic triggers below
#
# Until then, workflow can be triggered manually via workflow_dispatch
# on:
#   pull_request:
#     branches: [main, develop]
#     paths:
#       - 'backend/Shared/DTOs/**'
#       - 'backend/*/swagger.json'
#       - 'frontend/src/api/generated/**'
#       - 'scripts/generate-types.ps1'
#   push:
#     branches: [main]
#     paths:
#       - 'backend/Shared/DTOs/**'
#       - 'backend/*/swagger.json'

# Temporarily trigger only on manual dispatch for testing
on:
  workflow_dispatch:

jobs:
  validate-types:
    name: Validate Generated Types
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NSwag
        run: dotnet tool install -g NSwag.ConsoleCore --no-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Generate TypeScript types from swagger.json
        continue-on-error: true
        run: |
          pwsh scripts/generate-types.ps1 -Mode ci || echo "::warning::Type generation failed - swagger.json files may not exist yet"

      - name: Check if types are in sync
        id: check_diff
        run: |
          # Check if any .types.ts files exist
          if ! ls frontend/src/api/generated/*.types.ts 1> /dev/null 2>&1; then
            echo "status=skip" >> $GITHUB_OUTPUT
            echo "⏭️  No generated types found yet - skipping validation"
            echo "Run 'pwsh scripts/export-swagger.ps1' then 'pwsh scripts/generate-types.ps1 -Mode ci' to generate initial types"
          elif git diff --exit-code frontend/src/api/generated/*.types.ts 2>/dev/null; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Types are in sync"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Types are out of sync"
            git diff frontend/src/api/generated/*.types.ts || true
          fi

      - name: Fail if types are out of sync
        if: steps.check_diff.outputs.status == 'failure'
        run: |
          echo "::error::Generated TypeScript types are out of sync"
          echo ""
          echo "To fix:"
          echo "  1. Run: pwsh scripts/export-swagger.ps1"
          echo "  2. Run: pwsh scripts/generate-types.ps1 -Mode ci"
          echo "  3. Commit updated files"
          exit 1

      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-types
          path: frontend/src/api/generated/*.types.ts
          retention-days: 7

  type-check:
    name: TypeScript Type Check
    needs: validate-types
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint
