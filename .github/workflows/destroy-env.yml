name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm:
        description: 'Type "DESTROY" to confirm deletion'
        required: true
        type: string

# Prevent simultaneous deploy/destroy operations on the same environment
# Shared concurrency group with deploy workflows to prevent conflicts
concurrency:
  group: terraform-${{ github.event.inputs.environment }}  # Same as deploy workflows
  cancel-in-progress: false  # Queue instead of canceling

env:
  AWS_REGION: us-east-1

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ Confirmation failed. You must type 'DESTROY' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"

  destroy-infrastructure:
    runs-on: ubuntu-latest
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment }}-destroy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Create backend config
        run: |
          cat > backend-config.tfvars <<EOF
          bucket         = "${{ secrets.S3_BUCKET_NAME }}"
          key            = "deploy/${{ github.event.inputs.environment }}/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ secrets.DYNAMODB_TABLE_NAME }}"
          EOF
        working-directory: ./terraform/deploy

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_name                 = "${{ secrets.PROJECT_NAME }}"
          aws_region                   = "${{ env.AWS_REGION }}"
          cost_center                  = "${{ secrets.COST_CENTER }}"
          s3_bucket_name               = "${{ secrets.S3_BUCKET_NAME }}"
          dynamodb_table_name          = "${{ secrets.DYNAMODB_TABLE_NAME }}"
          vpc_id                       = "${{ secrets.VPC_ID }}"
          public_subnet_ids            = ${{ secrets.PUBLIC_SUBNET_IDS }}
          app_runner_security_group_id = "${{ secrets.APP_RUNNER_SECURITY_GROUP_ID }}"
          rds_security_group_id        = "${{ secrets.RDS_SECURITY_GROUP_ID }}"
          ecr_repository_urls = {
            identity_service    = "${{ secrets.ECR_IDENTITY_SERVICE_URL }}"
            api_gateway         = "${{ secrets.ECR_API_GATEWAY_URL }}"
            data_service        = "${{ secrets.ECR_DATA_SERVICE_URL }}"
            hull_sizing_service = "${{ secrets.ECR_HULL_SIZING_SERVICE_URL }}"
            frontend            = "${{ secrets.ECR_FRONTEND_URL }}"
          }
          cognito_user_pool_id        = "${{ secrets.COGNITO_USER_POOL_ID }}"
          cognito_user_pool_client_id = "${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}"
          cognito_domain              = "${{ secrets.COGNITO_DOMAIN }}"
          domain_name                 = "${{ secrets.DOMAIN_NAME }}"
          EOF
        working-directory: ./terraform/deploy

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.tfvars
        working-directory: ./terraform/deploy

      - name: Validate Environment Exists
        id: validate
        run: |
          echo "🔍 Checking if environment exists..."
          if terraform state list | grep -q "module."; then
            echo "✅ Environment found, proceeding with destroy"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No resources found for environment '${{ github.event.inputs.environment }}'"
            echo "State may be empty or environment already destroyed"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ./terraform/deploy

      - name: Pre-Destroy Cleanup (S3 Buckets)
        if: steps.validate.outputs.exists == 'true'
        run: |
          echo "🔍 Discovering and emptying S3 buckets..."
          ENV="${{ github.event.inputs.environment }}"
          PROJECT="${{ secrets.PROJECT_NAME }}"

          # Empty all S3 buckets for this environment
          for bucket_suffix in "frontend" "benchmark-raw" "benchmark-curated"; do
            BUCKET_NAME="${PROJECT}-${ENV}-${bucket_suffix}"
            echo "📦 Checking bucket: $BUCKET_NAME"

            if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
              echo "🗑️ Emptying bucket: $BUCKET_NAME"
              aws s3 rm "s3://$BUCKET_NAME" --recursive || echo "Bucket already empty"
              echo "✅ Bucket $BUCKET_NAME emptied"
            else
              echo "⚠️ Bucket $BUCKET_NAME does not exist or already deleted"
            fi
          done

      - name: Terraform Destroy
        if: steps.validate.outputs.exists == 'true'
        id: destroy
        run: |
          echo "🚀 Running Terraform destroy..."
          terraform destroy \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var-file="terraform.tfvars" \
            -auto-approve
        working-directory: ./terraform/deploy
        continue-on-error: true

      - name: Post-Destroy Cleanup (Always Run)
        if: always()
        run: |
          echo "🧹 Post-destroy cleanup - removing any remaining resources..."
          ENV="${{ github.event.inputs.environment }}"
          PROJECT="${{ secrets.PROJECT_NAME }}"
          
          # Delete App Runner services (Terraform doesn't always remove these)
          echo "🔍 Cleaning up App Runner services..."
          for service in "identity-service" "data-service" "api-gateway" "hull-sizing-service"; do
            SERVICE_ARN=$(aws apprunner list-services \
              --query "ServiceSummaryList[?ServiceName=='${PROJECT}-${ENV}-${service}'].ServiceArn | [0]" \
              --output text 2>/dev/null | head -1)
            
            if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
              echo "🗑️ Deleting App Runner service: ${service}"
              aws apprunner delete-service --service-arn "$SERVICE_ARN" || echo "  Failed to delete ${service}"
            else
              echo "✓ Service not found: ${service}"
            fi
          done
          
          # Delete CloudFront OAC if orphaned
          echo "🔍 Checking for CloudFront OAC..."
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${PROJECT}-${ENV}-oac'].Id | [0]" \
            --output text 2>/dev/null | head -1)
          
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
            echo "🗑️ Attempting to delete CloudFront OAC: $OAC_ID"
            ETAG=$(aws cloudfront get-origin-access-control --id "$OAC_ID" --query 'ETag' --output text)
            aws cloudfront delete-origin-access-control --id "$OAC_ID" --if-match "$ETAG" 2>/dev/null || \
              echo "⚠️ OAC still in use, will be cleaned up later"
          fi
          
          # Delete VPC Connector if orphaned
          echo "🔍 Checking for VPC Connector..."
          VPC_CONN_ARN=$(aws apprunner list-vpc-connectors \
            --query "VpcConnectors[?VpcConnectorName=='${PROJECT}-${ENV}-vpc-connector'].VpcConnectorArn | [0]" \
            --output text 2>/dev/null | head -1)
          
          if [ -n "$VPC_CONN_ARN" ] && [ "$VPC_CONN_ARN" != "None" ]; then
            echo "🗑️ Deleting VPC Connector"
            aws apprunner delete-vpc-connector --vpc-connector-arn "$VPC_CONN_ARN" || echo "  Failed to delete VPC connector"
          fi
          
          # Delete orphaned IAM roles
          echo "🔍 Checking for orphaned IAM roles..."
          for role in "app-runner-ecr-role" "app-runner-instance-role"; do
            ROLE_NAME="${PROJECT}-${ENV}-${role}"
            if aws iam get-role --role-name "$ROLE_NAME" 2>/dev/null | grep -q "RoleName"; then
              echo "🗑️ Cleaning up IAM role: $ROLE_NAME"
              
              # Detach policies
              aws iam list-attached-role-policies --role-name "$ROLE_NAME" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null | \
                tr '\t' '\n' | while read policy_arn; do
                  [ -n "$policy_arn" ] && aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$policy_arn" 2>/dev/null
                done
              
              aws iam delete-role --role-name "$ROLE_NAME" 2>/dev/null || echo "  Failed to delete role"
            fi
          done
          
          # Delete orphaned IAM policies
          echo "🔍 Checking for orphaned IAM policies..."
          for policy_name in "benchmark-s3-access" "secrets-access"; do
            POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='${PROJECT}-${ENV}-${policy_name}'].Arn | [0]" --output text 2>/dev/null | head -1)
            if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
              echo "🗑️ Deleting orphaned policy: ${policy_name}"
              aws iam delete-policy --policy-arn "$POLICY_ARN" || echo "  Failed to delete policy"
            fi
          done
          
          # Delete DB subnet group if orphaned
          echo "🔍 Checking for DB subnet group..."
          SUBNET_GROUP="${PROJECT}-${ENV}-db-subnet-group"
          if aws rds describe-db-subnet-groups --db-subnet-group-name "$SUBNET_GROUP" 2>/dev/null | grep -q "DBSubnetGroupName"; then
            echo "🗑️ Deleting DB subnet group"
            aws rds delete-db-subnet-group --db-subnet-group-name "$SUBNET_GROUP" || echo "  Failed to delete subnet group"
          fi
          
          echo "✅ Post-destroy cleanup complete"

      - name: Manual Resource Cleanup (if Terraform fails)
        if: steps.destroy.outcome == 'failure'
        run: |
          echo "⚠️ Terraform destroy failed, attempting manual cleanup..."
          ENV="${{ github.event.inputs.environment }}"
          PROJECT="${{ secrets.PROJECT_NAME }}"

          # Delete App Runner services
          echo "🔍 Cleaning up App Runner services..."
          for service in "identity-service" "data-service" "api-gateway" "hull-sizing-service"; do
            SERVICE_ARN=$(aws apprunner list-services \
              --query "ServiceSummaryList[?ServiceName=='${PROJECT}-${ENV}-${service}'].ServiceArn | [0]" \
              --output text 2>/dev/null || echo "")

            if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
              echo "🗑️ Deleting App Runner service: ${service}"
              aws apprunner delete-service --service-arn "$SERVICE_ARN" || echo "Failed to delete ${service}"
            fi
          done

          # Delete RDS instance
          echo "🔍 Cleaning up RDS instance..."
          DB_INSTANCE="${PROJECT}-${ENV}-db"
          if aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" 2>/dev/null; then
            echo "🗑️ Deleting RDS instance: $DB_INSTANCE (skip final snapshot)"
            aws rds delete-db-instance \
              --db-instance-identifier "$DB_INSTANCE" \
              --skip-final-snapshot \
              --delete-automated-backups || echo "Failed to delete RDS"
          fi

          # Delete CloudFront distribution
          echo "🔍 Cleaning up CloudFront distribution..."
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${PROJECT}-${ENV}-frontend'].Id | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "🗑️ Disabling CloudFront distribution: $DIST_ID"
            ETAG=$(aws cloudfront get-distribution-config --id "$DIST_ID" --query 'ETag' --output text)
            aws cloudfront get-distribution-config --id "$DIST_ID" --query 'DistributionConfig' > /tmp/dist-config.json

            # Disable distribution
            jq '.Enabled = false' /tmp/dist-config.json > /tmp/dist-config-disabled.json
            aws cloudfront update-distribution \
              --id "$DIST_ID" \
              --if-match "$ETAG" \
              --distribution-config file:///tmp/dist-config-disabled.json || echo "Failed to disable distribution"

            echo "⏳ Waiting for distribution to be disabled (this may take 10-15 minutes)..."
            echo "Distribution will be deleted automatically once disabled"
          fi

          # Delete S3 buckets
          echo "🔍 Cleaning up S3 buckets..."
          for bucket_suffix in "frontend" "benchmark-raw" "benchmark-curated"; do
            BUCKET_NAME="${PROJECT}-${ENV}-${bucket_suffix}"
            if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
              echo "🗑️ Deleting bucket: $BUCKET_NAME"
              aws s3 rb "s3://$BUCKET_NAME" --force || echo "Failed to delete $BUCKET_NAME"
            fi
          done

          # Delete VPC Connector
          echo "🔍 Cleaning up VPC Connector..."
          VPC_CONN=$(aws apprunner list-vpc-connectors \
            --query "VpcConnectors[?VpcConnectorName=='${PROJECT}-${ENV}-vpc-connector'].VpcConnectorArn | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$VPC_CONN" ] && [ "$VPC_CONN" != "None" ]; then
            echo "🗑️ Deleting VPC Connector"
            aws apprunner delete-vpc-connector --vpc-connector-arn "$VPC_CONN" || echo "Failed to delete VPC connector"
          fi

          # Delete IAM resources
          echo "🔍 Cleaning up IAM resources..."
          for role in "app-runner-ecr-role" "app-runner-instance-role"; do
            ROLE_NAME="${PROJECT}-${ENV}-${role}"
            if aws iam get-role --role-name "$ROLE_NAME" 2>/dev/null; then
              echo "🗑️ Detaching policies from role: $ROLE_NAME"

              # Detach managed policies
              ATTACHED_POLICIES=$(aws iam list-attached-role-policies --role-name "$ROLE_NAME" --query 'AttachedPolicies[].PolicyArn' --output text)
              for policy_arn in $ATTACHED_POLICIES; do
                aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$policy_arn" || echo "Failed to detach $policy_arn"
              done

              # Delete inline policies
              INLINE_POLICIES=$(aws iam list-role-policies --role-name "$ROLE_NAME" --query 'PolicyNames[]' --output text)
              for policy_name in $INLINE_POLICIES; do
                aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$policy_name" || echo "Failed to delete inline policy $policy_name"
              done

              # Delete role
              echo "🗑️ Deleting IAM role: $ROLE_NAME"
              aws iam delete-role --role-name "$ROLE_NAME" || echo "Failed to delete role $ROLE_NAME"
            fi
          done

          # Delete IAM policy
          POLICY_NAME="${PROJECT}-${ENV}-secrets-access"
          POLICY_ARN=$(aws iam list-policies \
            --query "Policies[?PolicyName=='$POLICY_NAME'].Arn | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
            echo "🗑️ Deleting IAM policy: $POLICY_NAME"
            aws iam delete-policy --policy-arn "$POLICY_ARN" || echo "Failed to delete policy"
          fi

          # Delete Secrets Manager secrets
          echo "🔍 Cleaning up Secrets Manager..."
          SECRET_NAME="${PROJECT}-${ENV}-db-password"
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" 2>/dev/null; then
            echo "🗑️ Deleting secret: $SECRET_NAME"
            aws secretsmanager delete-secret \
              --secret-id "$SECRET_NAME" \
              --force-delete-without-recovery || echo "Failed to delete secret"
          fi

          # Delete DB Subnet Group
          echo "🔍 Cleaning up DB Subnet Group..."
          SUBNET_GROUP="${PROJECT}-${ENV}-db-subnet-group"
          if aws rds describe-db-subnet-groups --db-subnet-group-name "$SUBNET_GROUP" 2>/dev/null; then
            echo "🗑️ Deleting DB subnet group: $SUBNET_GROUP"
            aws rds delete-db-subnet-group --db-subnet-group-name "$SUBNET_GROUP" || echo "Failed to delete subnet group"
          fi

          # Delete CloudFront OAC
          echo "🔍 Cleaning up CloudFront Origin Access Control..."
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${PROJECT}-${ENV}-oac'].Id | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
            ETAG=$(aws cloudfront get-origin-access-control --id "$OAC_ID" --query 'ETag' --output text)
            echo "🗑️ Deleting CloudFront OAC"
            aws cloudfront delete-origin-access-control --id "$OAC_ID" --if-match "$ETAG" || echo "Failed to delete OAC"
          fi

          echo "✅ Manual cleanup complete"
        continue-on-error: true

      - name: Remove Orphaned Resources from Terraform State
        if: always()
        run: |
          echo "🧹 Cleaning up Terraform state..."

          # Remove resources that no longer exist in AWS
          terraform state list | while read resource; do
            echo "Checking resource: $resource"
            # Remove if terraform refresh detects it's gone
          done || true

          echo "✅ State cleanup complete"
        working-directory: ./terraform/deploy
        continue-on-error: true

      - name: Release State Lock on Failure
        if: failure() && steps.destroy.outcome == 'failure'
        run: |
          echo "🔓 Attempting to release state lock..."

          # Query DynamoDB for the lock
          LOCK_INFO=$(aws dynamodb get-item \
            --table-name ${{ secrets.DYNAMODB_TABLE_NAME }} \
            --key '{"LockID":{"S":"${{ secrets.S3_BUCKET_NAME }}/deploy/${{ github.event.inputs.environment }}/terraform.tfstate-md5"}}' \
            --query 'Item.LockID.S' \
            --output text 2>/dev/null || echo "")

          if [ -n "$LOCK_INFO" ] && [ "$LOCK_INFO" != "None" ]; then
            echo "🔒 State lock detected, attempting force unlock..."
            cd terraform/deploy

            # Get the actual lock ID from terraform
            LOCK_ID=$(terraform force-unlock -force 2>&1 | grep -oP 'Lock ID: \K[a-f0-9-]+' | head -1 || echo "")

            if [ -n "$LOCK_ID" ]; then
              echo "📋 Lock ID: $LOCK_ID"
              terraform force-unlock -force "$LOCK_ID" || echo "⚠️ Could not auto-unlock, manual intervention required"
              echo "✅ State lock released"
            else
              echo "⚠️ Could not determine lock ID automatically"
              echo "💡 To manually unlock, run:"
              echo "   cd terraform/deploy"
              echo "   terraform init -backend-config=backend-config.tfvars"
              echo "   terraform force-unlock <LOCK_ID>"
            fi
          else
            echo "ℹ️ No state lock found"
          fi
        working-directory: .

      - name: Remove Terraform State (Optional)
        run: |
          echo "⚠️ Terraform state file remains in S3 for recovery purposes"
          echo "State location: s3://${{ secrets.S3_BUCKET_NAME }}/deploy/${{ github.event.inputs.environment }}/terraform.tfstate"
          echo "To permanently delete state, run: aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }}/deploy/${{ github.event.inputs.environment }}/terraform.tfstate"

  cleanup-ecr-images:
    runs-on: ubuntu-latest
    needs: destroy-infrastructure

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete ECR images for environment
        run: |
          ENV_TAG="${{ github.event.inputs.environment }}"

          # Function to delete images from a repository
          delete_images() {
            REPO_NAME=$1
            echo "Deleting images tagged with '$ENV_TAG' from $REPO_NAME..."
            IMAGE_IDS=$(aws ecr list-images --repository-name $REPO_NAME --query "imageIds[?imageTag=='$ENV_TAG']" --output json)

            if [ "$IMAGE_IDS" != "[]" ]; then
              aws ecr batch-delete-image --repository-name $REPO_NAME --image-ids "$IMAGE_IDS" || echo "Failed to delete images from $REPO_NAME"
            else
              echo "No images found with tag '$ENV_TAG' in $REPO_NAME"
            fi
          }

          # Extract repository names from ECR URLs
          IDENTITY_REPO=$(echo "${{ secrets.ECR_IDENTITY_SERVICE_URL }}" | cut -d'/' -f2)
          GATEWAY_REPO=$(echo "${{ secrets.ECR_API_GATEWAY_URL }}" | cut -d'/' -f2)
          DATA_REPO=$(echo "${{ secrets.ECR_DATA_SERVICE_URL }}" | cut -d'/' -f2)
          FRONTEND_REPO=$(echo "${{ secrets.ECR_FRONTEND_URL }}" | cut -d'/' -f2)

          delete_images "$IDENTITY_REPO"
          delete_images "$GATEWAY_REPO"
          delete_images "$DATA_REPO"
          delete_images "$FRONTEND_REPO"

  notify:
    runs-on: ubuntu-latest
    needs: [destroy-infrastructure, cleanup-ecr-images]
    if: always()

    steps:
      - name: Notify destruction status
        run: |
          if [ "${{ needs.destroy-infrastructure.result }}" == "success" ]; then
            echo "✅ Environment '${{ github.event.inputs.environment }}' destroyed successfully!"
            echo ""
            echo "📦 Resources destroyed:"
            echo "  - RDS PostgreSQL instance"
            echo "  - App Runner services (Identity, API Gateway, Data Service, Hull Sizing Service)"
            echo "  - S3 buckets (frontend, benchmark-raw, benchmark-curated)"
            echo "  - CloudFront distribution"
            echo "  - CloudWatch Log Groups"
            echo "  - Secrets Manager secrets"
            echo "  - IAM roles and policies"
            echo "  - VPC Connector"
            echo ""
            echo "⚠️ Resources NOT destroyed (shared across environments):"
            echo "  - VPC and networking (from Phase 4 setup)"
            echo "  - ECR repositories (from Phase 4 setup)"
            echo "  - Cognito User Pool (from Phase 4 setup)"
            echo "  - S3 Terraform state bucket"
            echo "  - DynamoDB state lock table"
            echo ""
            echo "💰 Estimated monthly cost savings:"
            echo "  - Dev: ~\$30-50/month"
            echo "  - Staging: ~\$50-80/month"
            echo "  - Prod: ~\$100+/month"
          elif [ "${{ needs.destroy-infrastructure.result }}" == "skipped" ]; then
            echo "ℹ️ Environment '${{ github.event.inputs.environment }}' was not found or already destroyed"
            echo "No resources to clean up."
          else
            echo "❌ Environment destruction failed!"
            echo ""
            echo "🔍 Troubleshooting steps:"
            echo "1. Check the 'destroy-infrastructure' job logs for errors"
            echo "2. Verify AWS credentials have sufficient permissions"
            echo "3. Check if state lock was released (see 'Release State Lock' step)"
            echo "4. Manually verify resources in AWS Console"
            echo ""
            echo "💡 Manual cleanup (if needed):"
            echo "  - App Runner: aws apprunner list-services --region ${{ env.AWS_REGION }}"
            echo "  - RDS: aws rds describe-db-instances --region ${{ env.AWS_REGION }}"
            echo "  - S3: aws s3 ls | grep ${{ github.event.inputs.environment }}"
            echo "  - State lock: Check DynamoDB table for locks"
            exit 1
          fi
